spring:
  application:
    name: campus-service
  profiles:
    default: local

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

campus:
  security:
    jwt:
      issuer: ${JWT_ISSUER:campus-service}
      audience: ${JWT_AUDIENCE:campus-service-clients}
      secret: ${JWT_SECRET:}
      access-token-ttl: ${JWT_ACCESS_TOKEN_TTL:PT15M}
    refresh-token-ttl: ${REFRESH_TOKEN_TTL:P30D}
    refresh-cookie:
      name: ${REFRESH_COOKIE_NAME:CAMPUS_REFRESH}
      secure: ${REFRESH_COOKIE_SECURE:true}
      same-site: ${REFRESH_COOKIE_SAME_SITE:Lax}
      path: ${REFRESH_COOKIE_PATH:/api/v1/auth}
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
