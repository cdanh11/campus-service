name: campus-platform-demo
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: campus_demo
      POSTGRES_USER: campus_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run scripts/start-demo.ps1 first}
    volumes:
      - campus-demo-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U campus_demo -d campus_demo']
      interval: 5s
      timeout: 3s
      retries: 24
  backend:
    build: .
    environment:
      SPRING_PROFILES_ACTIVE: local
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: campus_demo
      POSTGRES_USERNAME: campus_demo
      POSTGRES_PASSWORD: ${DEMO_DB_PASSWORD:?Run scripts/start-demo.ps1 first}
      JWT_SECRET: ${DEMO_JWT_SECRET:?Run scripts/start-demo.ps1 first}
      JWT_ISSUER: ${DEMO_JWT_ISSUER:?Run scripts/start-demo.ps1 first}
      JWT_AUDIENCE: campus-demo-client
      REFRESH_COOKIE_SECURE: 'false'
      REFRESH_COOKIE_NAME: CAMPUS_DEMO_REFRESH
      ALLOWED_ORIGINS: http://localhost:3300,http://127.0.0.1:3300
      SERVER_PORT: 8080
    ports:
      - '127.0.0.1:28080:8080'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, bash, /app/health.sh]
      interval: 5s
      timeout: 3s
      start_period: 60s
      retries: 24
  frontend:
    build: ../campus-client
    ports:
      - '127.0.0.1:3300:8080'
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O /dev/null http://127.0.0.1:8080/healthz']
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  campus-demo-data:
